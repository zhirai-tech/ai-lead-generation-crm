        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: zr_session
      description: Session cookie (HttpOnly). Mutating requests also require X-CSRF-Token.
    bearerAuth:
      type: http
      scheme: bearer
      description: API key with `zrk_` prefix
  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    Id:
      name: id
      in: path
      required: true
      schema: { type: string }
    CompanyId:
      name: companyId
      in: path
      required: true
      schema: { type: string }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string }
    Token:
      name: token
      in: path
      required: true
      schema: { type: string }
    FileId:
      name: fileId
      in: path
      required: true
      schema: { type: string }
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: Not authenticated
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Missing capability or CSRF failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Not found (or cross-workspace)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: State conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    PayloadTooLarge:
      description: Payload too large
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    TooManyRequests:
      description: Rate limited
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    AgentUnavailable:
      description: AI keyword generation unavailable (no fabricated output)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    ApiEnvelope:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean, example: true }
        data: { type: object, nullable: true }
    ErrorEnvelope:
      type: object
      required: [ok, error]
      properties:
        ok: { type: boolean, example: false }
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: VALIDATION_ERROR }
            message: { type: string, example: 企业名称不能为空 }
            details: { type: object, nullable: true }
    Pagination:
      type: object
      properties:
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
        hasMore: { type: boolean }
    OutreachSettings:
      type: object
      properties:
        requireApproval: { type: boolean, default: true }
        autoSendEnabled: { type: boolean, default: false }
        dailySendLimit: { type: integer, default: 50 }
        sendWindow:
          type: object
          properties:
            start: { type: integer, default: 9 }
            end: { type: integer, default: 17 }
            weekdays:
              type: array
              items: { type: integer }
            timezone: { type: string, default: Europe/Berlin }
        signature: { type: string }
        defaultLanguage: { type: string, default: en }
    CompanyInput:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 200 }
        domain: { type: string }
        website: { type: string, format: uri }
        country: { type: string, maxLength: 2 }
        region: { type: string }
        city: { type: string }
        address: { type: string }
        companyType: { type: string }
        industry: { type: string }
        employeeRange: { type: string }
        revenueRange: { type: string }
        description: { type: string, maxLength: 4000 }
        linkedinUrl: { type: string }
        phone: { type: string }
        status:
          type: string
          enum: [new, qualified, contacted, replied, customer, disqualified, archived]
        confidence:
          type: string
          enum: [unverified, low, medium, high]
        tags:
          type: array
          maxItems: 30
          items: { type: string }
        icpId: { type: string, nullable: true }
        ownerUserId: { type: string, nullable: true }
        source: { type: object }
    Company:
      type: object
      properties:
        id: { type: string, example: cmp_01JABCDEFG }
        workspaceId: { type: string }
        name: { type: string }
        normalizedName: { type: string }
        domain: { type: string, nullable: true }
        website: { type: string, nullable: true }
        country: { type: string, nullable: true }
        companyType: { type: string, nullable: true }
        industry: { type: string, nullable: true }
        status:
          type: string
          enum: [new, qualified, contacted, replied, customer, disqualified, archived]
        tags:
          type: array
          items: { type: string }
        confidence:
          type: string
          enum: [unverified, low, medium, high]
        dataQualityScore: { type: integer }
        contactsCount: { type: integer }
        score: { type: integer, nullable: true }
        automationState: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CompanyListEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/Pagination'
                - type: object
                  properties:
                    items:
                      type: array
                      items: { $ref: '#/components/schemas/Company' }
    CompanyEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/Company' }
    ContactInput:
      type: object
      required: [companyId]
      properties:
        companyId: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        fullName: { type: string }
        title: { type: string }
        roleCategory:
          type: string
          enum: [decision_maker, influencer, gatekeeper, technical, unknown]
        email: { type: string, format: email }
        emailType:
          type: string
          enum: [business, personal, role, inferred, unknown]
        emailStatus:
          type: string
          enum: [unverified, valid, risky, invalid, inferred]
        phone: { type: string }
        linkedinUrl: { type: string }
        country: { type: string, maxLength: 2 }
        language: { type: string }
        department: { type: string }
        isPrimary: { type: boolean }
        confidence:
          type: string
          enum: [unverified, low, medium, high]
        inferred: { type: boolean }
        source: { type: object }
    Contact:
      type: object
      properties:
        id: { type: string, example: ctc_01JABCDEFG }
        companyId: { type: string }
        fullName: { type: string, nullable: true }
        title: { type: string, nullable: true }
        roleCategory: { type: string }
        email: { type: string, nullable: true }
        emailType: { type: string }
        emailStatus: { type: string }
        isPrimary: { type: boolean }
        confidence: { type: string }
        companyName: { type: string }
        companyDomain: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    ContactListEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
