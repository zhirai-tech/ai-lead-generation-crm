openapi: 3.0.3
info:
  title: ZHIRAI Europe B2B AI Outreach Platform API
  version: 1.0.0
  description: |
    REST API for the ZHIRAI Europe B2B AI Outreach Platform (智睿欧洲 B2B AI 外贸获客平台).

    Authentication: browser session cookie (`zr_session`, HttpOnly) + `X-CSRF-Token` header
    for mutating requests, or `Authorization: Bearer zrk_...` API key.

    All successful responses use `{ "ok": true, "data": ... }`; errors use
    `{ "ok": false, "error": { "code", "message", "details" } }`.

    Coverage: core business endpoints. Operational endpoints (`/ops/*`), `/notifications`,
    `/audit`, `/usage` are documented in docs/API.md but intentionally omitted here.
  contact:
    name: ZHIRAI · 智睿科技 · 独立开发者
    email: xtang3125@gmail.com
    url: https://zhirai.cloud
  license:
    name: Proprietary (commercial license required)
    url: https://zhirai.cloud
servers:
  - url: http://127.0.0.1:4173
    description: Local development
  - url: https://{host}
    description: Production (reverse proxy with HTTPS)
    variables:
      host:
        default: outreach.example.com
security:
  - cookieAuth: []
  - bearerAuth: []
tags:
  - name: auth
  - name: workspace
  - name: settings
  - name: companies
  - name: contacts
  - name: products
  - name: icps
  - name: discovery
  - name: imports
  - name: campaigns
  - name: drafts
  - name: inbox
  - name: deals
  - name: automation
  - name: suppression
  - name: email-accounts
  - name: dashboard
  - name: agents
  - name: jobs
  - name: public
paths:
  /api/v1/health:
    get:
      tags: [public]
      operationId: health
      security: []
      summary: Health check
      responses:
        '200':
          description: Service status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
  /api/v1/auth/status:
    get:
      tags: [auth]
      operationId: authStatus
      security: []
      summary: Initialization and session status
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
  /api/v1/auth/setup:
    post:
      tags: [auth]
      operationId: authSetup
      security: []
      summary: First-run bootstrap (only when no users exist)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workspaceName, email, password]
              properties:
                workspaceName: { type: string, maxLength: 100 }
                name: { type: string, maxLength: 80 }
                email: { type: string, format: email }
                password: { type: string, minLength: 10 }
      responses:
        '200':
          description: Initialized and logged in; response data includes user, workspace, membership and csrfToken
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionEnvelope'
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: authLogin
      security: []
      summary: Login with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
                workspaceId: { type: string, nullable: true }
      responses:
        '200':
          description: Logged in; response data includes csrfToken
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionEnvelope'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: authLogout
      security: []
      summary: Revoke current session
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
  /api/v1/auth/me:
    get:
      tags: [auth]
      operationId: authMe
      summary: Current session info
      responses:
        '200':
          description: Session (includes csrfToken)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionEnvelope'
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/auth/password:
    post:
      tags: [auth]
      operationId: authChangePassword
      summary: Change password (revokes all sessions)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string, minLength: 10 }
      responses:
        '200':
          description: Password changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/auth/sessions:
    get:
      tags: [auth]
      operationId: authListSessions
      summary: List active sessions of current user
      responses:
        '200':
          description: Sessions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
  /api/v1/auth/api-keys:
    get:
      tags: [auth]
      operationId: authListApiKeys
      summary: List API keys
      responses:
        '200':
          description: API keys
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
    post:
      tags: [auth]
      operationId: authCreateApiKey
      summary: Create API key (plaintext returned once)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 80 }
                scopes:
                  type: array
                  items: { type: string }
      responses:
        '200':
          description: API key created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/workspace:
    get:
      tags: [workspace]
      operationId: getWorkspace
      summary: Current workspace with counts
      responses:
        '200':
          description: Workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
    patch:
      tags: [workspace]
      operationId: updateWorkspace
      summary: Update workspace name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 100 }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/workspace/members:
    get:
      tags: [workspace]
      operationId: listMembers
      summary: List workspace members
      responses:
        '200':
          description: Members
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
    post:
      tags: [workspace]
      operationId: createMember
      summary: Add member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: { type: string, format: email }
                name: { type: string, maxLength: 80 }
                role: { type: string, enum: [admin, member, viewer] }
                password: { type: string, minLength: 10 }
      responses:
        '200':
          description: Member created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/workspace/members/{userId}:
    patch:
      tags: [workspace]
      operationId: updateMember
      summary: Update member role/status
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role: { type: string, enum: [owner, admin, member, viewer] }
                status: { type: string, enum: [active, suspended] }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
    delete:
      tags: [workspace]
      operationId: removeMember
      summary: Remove member
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
  /api/v1/settings:
    get:
      tags: [settings]
      operationId: getSettings
      summary: Get settings, providers and credentials metadata
      responses:
        '200':
          description: Settings bundle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
    patch:
      tags: [settings]
      operationId: updateSettings
      summary: Update one or more setting groups (deep merge)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                outreach:
                  $ref: '#/components/schemas/OutreachSettings'
                limits: { type: object }
                retention: { type: object }
                ai: { type: object }
                compliance: { type: object }
                enrichment: { type: object }
      responses:
        '200':
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/settings/providers/{key}:
    patch:
      tags: [settings]
      operationId: updateProvider
      summary: Enable/disable or configure an external provider
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                isEnabled: { type: boolean }
                config: { type: object }
      responses:
        '200':
          description: Providers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
  /api/v1/settings/credentials:
    get:
      tags: [settings]
      operationId: listCredentials
      summary: List credentials (masked, never plaintext)
      responses:
        '200':
          description: Credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
  /api/v1/settings/credentials/{kind}/{providerKey}:
    put:
      tags: [settings]
      operationId: saveCredential
      summary: Save encrypted integration credential
      parameters:
        - name: kind
          in: path
          required: true
          schema: { type: string, enum: [ai_provider, data_provider, email_api, webhook] }
        - name: providerKey
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { type: string }
                secret:
                  type: object
                  additionalProperties: { type: string }
                config: { type: object }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
  /api/v1/settings/credentials/{id}:
    delete:
      tags: [settings]
      operationId: deleteCredential
      summary: Delete credential
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
  /api/v1/providers:
    get:
      tags: [settings]
      operationId: listProviders
      summary: External provider catalogue
      responses:
        '200':
          description: Providers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
  /api/v1/companies:
    get:
      tags: [companies]
      operationId: listCompanies
      summary: List companies
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: q
          in: query
          schema: { type: string }
        - name: country
          in: query
          description: Comma separated ISO2 codes
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
        - name: minScore
          in: query
          schema: { type: integer, minimum: 0, maximum: 100 }
        - name: maxScore
          in: query
          schema: { type: integer, minimum: 0, maximum: 100 }
        - name: hasEmail
          in: query
          schema: { type: boolean }
        - name: sort
          in: query
          schema: { type: string }
        - name: order
          in: query
          schema: { type: string, enum: [asc, desc] }
      responses:
        '200':
          description: Company page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyListEnvelope'
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [companies]
      operationId: createCompany
      summary: Create company
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyInput'
      responses:
        '200':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyEnvelope'
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/companies/{id}:
    get:
      tags: [companies]
      operationId: getCompany
      summary: Company detail aggregate
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Company detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [companies]
      operationId: updateCompany
      summary: Update company
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyInput'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyEnvelope'
    delete:
      tags: [companies]
      operationId: deleteCompany
      summary: Soft delete company
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/companies/bulk:
    post:
      tags: [companies]
      operationId: bulkCompanies
      summary: Bulk action (score/archive/assign/status)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, ids]
              properties:
                action: { type: string, enum: [score, archive, assign, status] }
                ids:
                  type: array
                  maxItems: 200
                  items: { type: string }
                productId: { type: string }
                ownerUserId: { type: string }
                status: { type: string }
      responses:
        '200':
          description: Result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
  /api/v1/companies/{id}/score:
    post:
      tags: [companies]
      operationId: scoreCompany
      summary: Rule-based company scoring with explainable factors
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId]
              properties:
                productId: { type: string }
      responses:
        '200':
          description: Score result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScoreEnvelope'
  /api/v1/companies/{id}/enrich:
    post:
      tags: [companies]
      operationId: enrichCompany
      summary: Enrich company (contacts / inferred emails)
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Enrichment result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
  /api/v1/companies/{id}/crawl:
    post:
      tags: [companies]
      operationId: crawlCompany
      summary: Crawl public company website
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                urls:
                  type: array
                  maxItems: 5
                  items: { type: string, format: uri }
      responses:
        '200':
          description: Crawl result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
  /api/v1/companies/{id}/timeline:
    get:
      tags: [companies]
      operationId: getCompanyTimeline
      summary: Company activity timeline
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Timeline
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
  /api/v1/companies/{id}/sources:
    get:
      tags: [companies]
      operationId: getCompanySources
      summary: Provenance records for a company
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Sources
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
  /api/v1/companies/{id}/verifications:
    get:
      tags: [companies]
      operationId: getCompanyVerifications
      summary: Data verification records
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Verifications
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
  /api/v1/contacts:
    get:
      tags: [contacts]
      operationId: listContacts
      summary: List contacts
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: q
          in: query
          schema: { type: string }
        - name: companyId
          in: query
          schema: { type: string }
        - name: emailStatus
          in: query
          schema: { type: string }
        - name: hasEmail
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: Contact page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactListEnvelope'
    post:
      tags: [contacts]
      operationId: createContact
      summary: Create contact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactInput'
      responses:
        '200':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactEnvelope'
  /api/v1/contacts/infer-email:
    post:
      tags: [contacts]
      operationId: inferEmails
      summary: Infer likely email addresses (status always "inferred")
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [companyId]
              properties:
                companyId: { type: string }
                firstName: { type: string }
                lastName: { type: string }
      responses:
        '200':
          description: Candidates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
  /api/v1/contacts/{id}:
    get:
      tags: [contacts]
      operationId: getContact
      summary: Contact detail
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Contact
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
    patch:
      tags: [contacts]
      operationId: updateContact
      summary: Update contact
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactInput'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactEnvelope'
    delete:
      tags: [contacts]
      operationId: deleteContact
      summary: Soft delete contact
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
  /api/v1/contacts/{id}/verify:
    post:
      tags: [contacts]
      operationId: verifyContactEmail
      summary: Verify contact email (syntax + MX)
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Verification result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
  /api/v1/products:
    get:
      tags: [products]
      operationId: listProducts
      summary: List products
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: q
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [active, draft, archived] }
      responses:
        '200':
          description: Products
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
    post:
      tags: [products]
      operationId: createProduct
      summary: Create product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '200':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
  /api/v1/products/{id}:
    get:
      tags: [products]
      operationId: getProduct
      summary: Product detail
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
    patch:
      tags: [products]
      operationId: updateProduct
      summary: Update product
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
    delete:
      tags: [products]
      operationId: deleteProduct
      summary: Soft delete product
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
  /api/v1/products/{id}/generate-keywords:
    post:
      tags: [products]
      operationId: generateProductKeywords
      summary: Generate English B2B keywords for a product (keyword_research agent)
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties: {}
      responses:
        '200':
          description: Generated keywords (also persisted to products.keywords)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeywordGenerationEnvelope'
        '503': { $ref: '#/components/responses/AgentUnavailable' }
  /api/v1/products/{id}/files:
    get:
      tags: [products]
      operationId: listProductFiles
      summary: List product images and PDF documents
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Files
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductFileListEnvelope'
    post:
      tags: [products]
